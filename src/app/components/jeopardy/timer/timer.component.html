<div class="d-flex align-items-center gap-2">
  <div class="timer-display badge bg-info text-dark p-2">{{ remaining }}s</div>
  <div>
    <button class="btn btn-sm btn-outline-primary mx-2" (click)="start()" [disabled]="running">Start</button>
    <button class="btn btn-sm btn-outline-secondary mx-2" (click)="stop()">Stop</button>
    <button class="btn btn-sm btn-outline-warning mx-2" (click)="reset()">Reset</button>
  </div>
</div>
